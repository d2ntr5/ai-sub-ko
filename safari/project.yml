# Safari판 (Mac App Store) — xcodegen 으로 만든다: bash safari/scripts/safari.sh (서명은 스크립트가 따로 함)
name: AISubKo
options:
  deploymentTarget: { macOS: "15.0" }
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_HARDENED_RUNTIME: "YES"
    AISUBKO_KEYCHAIN_GROUP: "TEAM.io.github.d2ntr5.ai-sub-ko.shared"
    AISUBKO_URL_SCHEME: aisubko
targets:
  AISubKo:
    type: application
    platform: macOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.d2ntr5.ai-sub-ko
        PRODUCT_NAME: AISubKo
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
    dependencies:
      - target: AISubKoExtension
        embed: true
        codeSign: false
  AISubKoExtension:
    type: app-extension
    platform: macOS
    sources:
      - Extension
      - Shared
      - path: build/ext/Resources
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.d2ntr5.ai-sub-ko.extension
        PRODUCT_NAME: AISubKoExtension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
